<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Zadanie 31 – Dworak</title>
</head>
<body>

<h2>Zadanie 31 – ciężarówka</h2>
<p>
Oblicz czas jazdy ciężarówki, znając drogę i prędkość.
</p>

<script>
  let droga = parseFloat(prompt("Podaj drogę (km):"));
  let predkosc = parseFloat(prompt("Podaj prędkość (km/h):"));

  let czas = droga / predkosc;

  document.write("Czas jazdy ciężarówki: " + czas.toFixed(2) + " h");
</script>

</body>
</html>
