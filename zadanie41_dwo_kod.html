<!DOCTYPE html>
<html lang="pl">
<head>
<title>Zadanie JavaScript</title>
<meta charset="utf-8">
<style>
h1 { text-transform: uppercase; }
</style>
</head>
<body>

<h1>Proste działania</h1>
<h1>Krzysztof Dworak 3k</h1>

<label for="a">Podaj pierwszą liczbę:</label>
<input type="number" id="a">
<br><br>

<label for="b">Podaj drugą liczbę:</label>
<input type="number" id="b">
<br><br>

<input type="button" value="DODAWANIE" onclick="suma_dwo()">
<input type="button" value="ODEJMOWANIE" onclick="roznica_dwo()">
<input type="button" value="MNOŻENIE" onclick="iloczyn_dwo()">
<input type="button" value="DZIELENIE" onclick="iloraz_dwo()">
<input type="button" value="TEORIA" onclick="teoria_dwo()">

<div id="wynik" style="margin-top:20px;"></div>

<script>
function suma_dwo()
{
var a = document.getElementById("a").value;
var b = document.getElementById("b").value;

if (a == "" || b == "")
{
document.getElementById("wynik").innerHTML = "Proszę uzupełnić obie liczby.";
} else
{
a = parseFloat(a);
b = parseFloat(b);
var wynik = a + b;
document.getElementById("wynik").innerHTML = "Wynik działania wynosi: " + wynik;
}
}

function roznica_dwo()
{
var a = document.getElementById("a").value;
var b = document.getElementById("b").value;

if (a == "" || b == "")
{
document.getElementById("wynik").innerHTML = "Proszę uzupełnić obie liczby.";
} else
{
a = parseFloat(a);
b = parseFloat(b);
var wynik = a - b;
document.getElementById("wynik").innerHTML = "Wynik działania wynosi: " + wynik;
}
}

function iloczyn_dwo()
{
var a = document.getElementById("a").value;
var b = document.getElementById("b").value;

if (a == "" || b == "")
{
document.getElementById("wynik").innerHTML = "Proszę uzupełnić obie liczby.";
} else
{
a = parseFloat(a);
b = parseFloat(b);
var wynik = a * b;
document.getElementById("wynik").innerHTML = "Wynik działania wynosi: " + wynik;
}
}

function iloraz_dwo()
{
var a = document.getElementById("a").value;
var b = document.getElementById("b").value;

if (a == "" || b == "")
{
document.getElementById("wynik").innerHTML = "Proszę uzupełnić obie liczby.";
} else
{
a = parseFloat(a);
b = parseFloat(b);

if (b == 0)
{
document.getElementById("wynik").innerHTML = "Nie wolno dzielić przez zero.";
}
else
{
var wynik = a / b;
document.getElementById("wynik").innerHTML = "Wynik działania wynosi: " + wynik;
}
}
}

function teoria_dwo()
{
document.write("<h2>Teoria - Dworak</h2>");
document.write("To samo co wcześniej, tylko podpis zmieniony 😎");
}
</script>

</body>
</html>
