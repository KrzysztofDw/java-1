<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Zadanie 30 – Dworak</title>
</head>
<body>

<h2>Zadanie 30 – ciężarówka</h2>
<p>
Oblicz drogę, jaką przejedzie ciężarówka, jeżeli znamy jej prędkość oraz czas jazdy.
</p>

<script>
  let predkosc = parseFloat(prompt("Podaj prędkość ciężarówki (km/h):"));
  let czas = parseFloat(prompt("Podaj czas jazdy (h):"));

  let droga = predkosc * czas;

  document.write("Ciężarówka przejechała: " + droga + " km");
</script>

</body>
</html>
